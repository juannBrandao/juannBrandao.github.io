<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Kaira - 1 Ano</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./script.js"></script>
</head>
<body>
  <div class="convite-container">
    <div class="convite-header">
      <img src="moranguinho1.svg" alt="Foto de Kaira">
      <h1>Kaira</h1>
      <!-- <p>Você é nosso(a) convidado(a) especial!</p> -->
      <br>
    </div>
    <div class="convite-body">
      <p>A pequena Kaira está fazendo 1 aninho. Venha comemorar conosco!</p>
      <p class="convite-date">07/08 às 14:00</p>
      <a href="#confirmacao" class="btn">Confirmar Presença</a>
    </div>
    <div class="gift-suggestions">
      <h2>Sugestões de Presentes</h2>
      <ul>
        <li>Roupas tamanho 2 ou 3</li>
        <li>Calçados tamanho 20/21</li>
        <li>Brinquedos</li>
      </ul>
    </div>
  </div>
</body>
</html>
